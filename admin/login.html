<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Sarkari Result</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w2.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23003399%22/><text y=%22.9em%22 font-size=%2270%22 font-family=%22Arial%22 font-weight=%22bold%22 x=%2250%%22 text-anchor=%22middle%22 fill=%22%23f5a623%22>SR</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-container">
    <div class="login-card">
        <h1 style="text-align: center; margin-bottom: 2rem;">Admin Login</h1>
        <form id="loginForm">
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                Sign In
            </button>
            <p id="message" style="text-align: center; margin-top: 1rem; font-size: 0.9rem;"></p>
        </form>
    </div>

    <script src="js/admin.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const message = document.getElementById('message');

            const res = await api.login(username, password);
            if (res && res.success) {
                localStorage.setItem('adminToken', res.token);
                localStorage.setItem('adminUser', JSON.stringify(res.user));
                window.location.href = 'dashboard.html';
            } else {
                message.style.color = 'var(--danger)';
                message.innerText = res ? res.message : 'Login failed';
            }
        });
    </script>
</body>
</html>
