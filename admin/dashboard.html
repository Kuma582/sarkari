<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sarkari Result Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 style="margin-bottom: 2.5rem; display: flex; align-items: center; gap: 0.8rem;">
                <i class="fas fa-user-shield text-primary"></i> Admin
            </h2>
            <nav>
                <ul style="list-style: none;">
                    <li style="margin-bottom: 0.5rem;">
                        <a href="dashboard.html" class="btn" style="width: 100%; justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li style="margin-bottom: 0.5rem;">
                        <a href="posts.html" class="btn" style="width: 100%; justify-content: flex-start; color: var(--text-muted);">
                            <i class="fas fa-file-invoice"></i> Manage Posts
                        </a>
                    </li>
                    <li style="margin-bottom: 0.5rem;">
                        <a href="ads.html" class="btn" style="width: 100%; justify-content: flex-start; color: var(--text-muted);">
                            <i class="fas fa-ad"></i> Manage Ads
                        </a>
                    </li>
                    <li style="margin-top: 3rem;">
                        <button onclick="logout()" class="btn" style="width: 100%; justify-content: flex-start; color: var(--danger);">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="flex justify-between items-center mb-4">
                <h1>Dashboard Overview</h1>
                <div class="flex items-center gap-2">
                    <span id="adminName" style="color: var(--text-muted);">Admin</span>
                    <div style="width: 40px; height: 40px; background: var(--primary); border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>

            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Total Posts</span>
                    <span id="totalPosts" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Total Vacancy</span>
                    <span id="totalVacancySum" class="stat-value">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Male / Female</span>
                    <span id="vacancyGender" class="stat-value" style="font-size: 1.5rem;">0 / 0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Total Users</span>
                    <span id="totalUsers" class="stat-value">0</span>
                </div>
            </div>

            <div class="grid" style="display: grid; grid-template-columns: 2fr 1fr; gap: 1.5rem;">
                <div class="card">
                    <h3>Recent Posts</h3>
                    <div class="table-container mt-4">
                        <table>
                            <thead>
                                <tr>
                                    <th>Title</th>
                                    <th>Category</th>
                                    <th>Date</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="recentPostsTable">
                                <!-- Data will be injected here -->
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card">
                    <h3>Category Wise</h3>
                    <div id="categoryStats" class="mt-4">
                        <!-- Data will be injected here -->
                    </div>
                </div>
                <div class="card">
                    <h3>Department Wise</h3>
                    <div id="departmentStats" class="mt-4">
                        <!-- Data will be injected here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script>
        async function loadDashboard() {
            const adminUser = JSON.parse(localStorage.getItem('adminUser'));
            document.getElementById('adminName').innerText = adminUser.username;

            const res = await api.getStats();
            if (res && res.success) {
                const { totalPosts, totalUsers, categoryStats, recentPosts } = res.data;
                
                document.getElementById('totalPosts').innerText = totalPosts;
                document.getElementById('totalUsers').innerText = totalUsers;
                
                const { vacancyTotals, departmentStats } = res.data;
                document.getElementById('totalVacancySum').innerText = vacancyTotals.totalVacancies || 0;
                document.getElementById('vacancyGender').innerText = `${vacancyTotals.maleVacancies || 0} / ${vacancyTotals.femaleVacancies || 0}`;

                // Recent Posts Table
                const recentTable = document.getElementById('recentPostsTable');
                recentTable.innerHTML = recentPosts.map(post => `
                    <tr>
                        <td>${post.title}</td>
                        <td><span style="background: rgba(99,102,241,0.1); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${post.category}</span></td>
                        <td style="color: var(--text-muted); font-size: 0.85rem;">${new Date(post.createdAt).toLocaleDateString()}</td>
                        <td>
                            <a href="posts.html?edit=${post._id}" class="btn" style="padding: 4px 8px; background: rgba(255,255,255,0.05); color: var(--primary);">
                                <i class="fas fa-edit"></i> Edit
                            </a>
                        </td>
                    </tr>
                `).join('');

                // Category Stats
                const catStatsDiv = document.getElementById('categoryStats');
                catStatsDiv.innerHTML = categoryStats.map(stat => `
                    <div class="flex justify-between items-center mb-4">
                        <span style="font-size: 0.9rem;">${stat._id}</span>
                        <span style="font-weight: 600; background: #334155; padding: 2px 10px; border-radius: 12px; font-size: 0.8rem;">${stat.count}</span>
                    </div>
                `).join('');

                // Department Stats
                const deptStatsDiv = document.getElementById('departmentStats');
                deptStatsDiv.innerHTML = departmentStats.length > 0 
                    ? departmentStats.map(stat => `
                        <div class="flex justify-between items-center mb-4">
                            <span style="font-size: 0.9rem;">${stat._id}</span>
                            <span style="font-weight: 600; background: var(--primary); padding: 2px 10px; border-radius: 12px; font-size: 0.8rem;">${stat.count}</span>
                        </div>
                    `).join('')
                    : '<p style="color: var(--text-muted); font-size: 0.9rem;">No department data available.</p>';
            }
        }

        loadDashboard();
    </script>
</body>
</html>
