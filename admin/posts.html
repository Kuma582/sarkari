<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Posts - Sarkari Result Admin</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w2.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23003399%22/><text y=%22.9em%22 font-size=%2270%22 font-family=%22Arial%22 font-weight=%22bold%22 x=%2250%%22 text-anchor=%22middle%22 fill=%22%23f5a623%22>SR</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <h2 style="margin-bottom: 2.5rem; display: flex; align-items: center; gap: 0.8rem;">
                <i class="fas fa-user-shield text-primary"></i> Admin
            </h2>
            <nav>
                <ul style="list-style: none;">
                    <li style="margin-bottom: 0.5rem;">
                        <a href="dashboard.html" class="btn" style="width: 100%; justify-content: flex-start; color: var(--text-muted);">
                            <i class="fas fa-home"></i> Dashboard
                        </a>
                    </li>
                    <li style="margin-bottom: 0.5rem;">
                        <a href="posts.html" class="btn" style="width: 100%; justify-content: flex-start; background: rgba(99, 102, 241, 0.1); color: var(--primary);">
                            <i class="fas fa-file-invoice"></i> Manage Posts
                        </a>
                    </li>
                    <li style="margin-bottom: 0.5rem;">
                        <a href="ads.html" class="btn" style="width: 100%; justify-content: flex-start; color: var(--text-muted);">
                            <i class="fas fa-ad"></i> Manage Ads
                        </a>
                    </li>
                    <li style="margin-top: 3rem;">
                        <button onclick="logout()" class="btn" style="width: 100%; justify-content: flex-start; color: var(--danger);">
                            <i class="fas fa-sign-out-alt"></i> Logout
                        </button>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="flex justify-between items-center mb-4">
                <h1>Job Posts</h1>
                <button onclick="openModal()" class="btn btn-primary">
                    <i class="fas fa-plus"></i> New Post
                </button>
            </header>

            <div class="card">
                <div class="flex gap-2 mb-4">
                    <input type="text" id="searchInput" class="form-control" placeholder="Search posts..." style="max-width: 300px;">
                    <select id="categoryFilter" class="form-control" style="max-width: 200px;">
                        <option value="">All Categories</option>
                        <option>Latest Jobs</option>
                        <option>Results</option>
                        <option>Admit Cards</option>
                        <option>Answer Keys</option>
                        <option>Syllabus</option>
                        <option>Admission</option>
                    </select>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Category</th>
                                <th>Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="postsTableBody">
                            <!-- Posts will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="postModal" style="display:none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 1000; align-items: center; justify-content: center; padding: 2rem;">
        <div class="card" style="width: 100%; max-width: 800px; max-height: 90vh; overflow-y: auto;">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle">Add New Post</h2>
                <button onclick="closeModal()" class="btn" style="background: transparent; color: var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <form id="postForm">
                <input type="hidden" id="postId">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Title</label>
                        <input type="text" id="title" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label>Category</label>
                        <select id="category" class="form-control" required>
                            <option>Latest Jobs</option>
                            <option>Results</option>
                            <option>Admit Cards</option>
                            <option>Answer Keys</option>
                            <option>Syllabus</option>
                            <option>Admission</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Department (e.g. SSC, UPSC, Railway)</label>
                    <input type="text" id="department" class="form-control" placeholder="e.g. Staff Selection Commission">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="description" class="form-control" rows="4" required></textarea>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Apply Start Date</label>
                        <input type="date" id="applyStartDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Last Date to Apply</label>
                        <input type="date" id="lastDate" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Scheduled At (Publish Time) - Set when this post becomes live</label>
                        <input type="datetime-local" id="scheduledAt" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Admit Card Date (e.g. June 2025)</label>
                        <input type="text" id="admitCardDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Exam Date (e.g. 15-20 July 2025)</label>
                        <input type="text" id="examDate" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Result Date</label>
                        <input type="text" id="resultDate" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Answer Key Date</label>
                        <input type="text" id="answerKeyDate" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Exam Mode (Written / Physical / Direct)</label>
                        <input type="text" id="examMode" class="form-control" placeholder="e.g. Written Exam">
                    </div>
                    <div class="form-group">
                        <label>Payment Mode (Online / Offline)</label>
                        <input type="text" id="paymentMode" class="form-control" placeholder="e.g. Online (Net Banking, Card)">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Application Fees (Category-wise)</label>
                        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.6rem; margin-top: 0.5rem; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">General / OBC / EWS</label>
                                <input type="text" id="fee_general" class="form-control" placeholder="e.g. ₹500">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">SC / ST</label>
                                <input type="text" id="fee_scst" class="form-control" placeholder="e.g. ₹250">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">PH / Divyang</label>
                                <input type="text" id="fee_ph" class="form-control" placeholder="e.g. ₹0">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">Female (All Cat.)</label>
                                <input type="text" id="fee_female" class="form-control" placeholder="e.g. ₹250">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">Ex-Serviceman</label>
                                <input type="text" id="fee_exsm" class="form-control" placeholder="e.g. ₹0">
                            </div>
                            <div>
                                <label style="font-size:0.75rem; color: var(--text-muted);">Payment Mode</label>
                                <input type="text" id="paymentMode" class="form-control" placeholder="Online / Offline">
                            </div>
                        </div>
                        <input type="hidden" id="applicationFees">
                    </div>
                    <div class="form-group">
                        <label>Age Limit (e.g. 18-25 Years)</label>
                        <input type="text" id="ageLimit" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group" style="grid-column: span 2;">
                        <label>Eligibility / Education (Check all that apply)</label>
                        <div id="eligibilityOptions" style="display: flex; flex-wrap: wrap; gap: 0.8rem; margin-top: 0.5rem; background: rgba(255,255,255,0.05); padding: 1rem; border-radius: 8px;">
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="10th Pass"> 10th Pass
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="12th Pass"> 12th Pass
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="ITI"> ITI
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="Diploma"> Diploma
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="Graduation"> Graduation
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="Post Graduation"> Post Graduation
                            </label>
                            <label style="display: flex; align-items: center; gap: 0.4rem; cursor: pointer; font-size: 0.85rem;">
                                <input type="checkbox" class="edu-checkbox" value="B.Ed"> B.Ed
                            </label>
                            <input type="text" id="otherEligibility" class="form-control" placeholder="Other specific requirements" style="flex: 1; min-width: 200px; height: 32px; font-size: 0.8rem;">
                        </div>
                        <input type="hidden" id="eligibility">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Total Vacancies</label>
                        <input type="number" id="totalVacancies" class="form-control">
                    </div>
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label>Male Vacancies</label>
                        <input type="number" id="maleVacancies" class="form-control">
                    </div>
                    <div class="form-group">
                        <label>Female Vacancies</label>
                        <input type="number" id="femaleVacancies" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label>Post-wise Vacancy Details</label>
                    <div id="vacancyContainer" style="margin-bottom: 0.5rem;">
                        <!-- Vacancy rows will be added here -->
                    </div>
                    <button type="button" onclick="addVacancyRow()" class="btn" style="font-size: 0.8rem; background: rgba(255,255,255,0.05); color: var(--success);">
                        <i class="fas fa-plus"></i> Add Post Detail
                    </button>
                    <input type="hidden" id="vacancyDetails">
                </div>
                <div class="form-group">
                    <label>Important Links</label>
                    <div id="linksContainer" style="margin-bottom: 0.5rem;">
                        <!-- Link rows will be added here -->
                    </div>
                    <button type="button" onclick="addLinkRow()" class="btn" style="font-size: 0.8rem; background: rgba(255,255,255,0.05); color: var(--primary);">
                        <i class="fas fa-plus"></i> Add Link
                    </button>
                    <input type="hidden" id="importantLinks">
                </div>
                <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 1rem;">
                    <span id="btnText">Save Post</span>
                    <span id="btnSpinner" style="display: none;"><i class="fas fa-spinner fa-spin ms-2"></i></span>
                </button>
            </form>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        let currentPosts = [];

        function addLinkRow(label = '', url = '') {
            const container = document.getElementById('linksContainer');
            const row = document.createElement('div');
            row.className = 'link-row flex gap-2 mb-2';
            row.innerHTML = `
                <input type="text" placeholder="Label (e.g. Apply)" class="form-control link-label" value="${label}" style="flex: 1;">
                <input type="text" placeholder="URL (Google link, etc.)" class="form-control link-url" value="${url}" style="flex: 2;">
                <button type="button" onclick="this.parentElement.remove()" class="btn text-danger" style="padding: 0 10px;"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        }

        function getLinksAsJson() {
            const rows = document.querySelectorAll('.link-row');
            const links = [];
            rows.forEach(row => {
                const label = row.querySelector('.link-label').value;
                const url = row.querySelector('.link-url').value;
                if (label && url) links.push({ label, url });
            });
            return JSON.stringify(links);
        }

        function addVacancyRow(post = '', count = '') {
            const container = document.getElementById('vacancyContainer');
            const row = document.createElement('div');
            row.className = 'vacancy-row flex gap-2 mb-2';
            row.innerHTML = `
                <input type="text" placeholder="Post Name (e.g. General)" class="form-control v-post" value="${post}" style="flex: 2;">
                <input type="number" placeholder="Count" class="form-control v-count" value="${count}" style="flex: 1;">
                <button type="button" onclick="this.parentElement.remove()" class="btn text-danger" style="padding: 0 10px;"><i class="fas fa-times"></i></button>
            `;
            container.appendChild(row);
        }

        function getVacancyAsJson() {
            const rows = document.querySelectorAll('.vacancy-row');
            const data = [];
            rows.forEach(row => {
                const post = row.querySelector('.v-post').value;
                const count = row.querySelector('.v-count').value;
                if (post && count) data.push({ post, total: count });
            });
            return JSON.stringify(data);
        }

        function getEligibility() {
            const checkboxes = document.querySelectorAll('.edu-checkbox:checked');
            const selected = Array.from(checkboxes).map(cb => cb.value);
            const other = document.getElementById('otherEligibility').value.trim();
            if (other) selected.push(other);
            return selected.join(', ');
        }

        function setEligibility(value = '') {
            const checkboxes = document.querySelectorAll('.edu-checkbox');
            checkboxes.forEach(cb => cb.checked = false);
            document.getElementById('otherEligibility').value = '';
            
            if (!value) return;
            
            const parts = value.split(',').map(p => p.trim());
            const knownValues = Array.from(checkboxes).map(cb => cb.value);
            
            const others = [];
            parts.forEach(p => {
                const cb = Array.from(checkboxes).find(c => c.value === p);
                if (cb) {
                    cb.checked = true;
                } else {
                    others.push(p);
                }
            });
            
            if (others.length > 0) {
                document.getElementById('otherEligibility').value = others.join(', ');
            }
        }

        function getFeesAsString() {
            const gen    = document.getElementById('fee_general').value.trim();
            const scst   = document.getElementById('fee_scst').value.trim();
            const ph     = document.getElementById('fee_ph').value.trim();
            const female = document.getElementById('fee_female').value.trim();
            const exsm   = document.getElementById('fee_exsm').value.trim();
            const parts  = [];
            if (gen)    parts.push(`Gen/OBC/EWS: ${gen}`);
            if (scst)   parts.push(`SC/ST: ${scst}`);
            if (ph)     parts.push(`PH/Divyang: ${ph}`);
            if (female) parts.push(`Female: ${female}`);
            if (exsm)   parts.push(`Ex-SM: ${exsm}`);
            return parts.join(' | ');
        }

        function setFeesFromString(str = '') {
            ['fee_general','fee_scst','fee_ph','fee_female','fee_exsm'].forEach(id => {
                document.getElementById(id).value = '';
            });
            if (!str) return;
            const map = { 'Gen/OBC/EWS': 'fee_general', 'SC/ST': 'fee_scst', 'PH/Divyang': 'fee_ph', 'Female': 'fee_female', 'Ex-SM': 'fee_exsm' };
            str.split('|').forEach(part => {
                const [key, val] = part.split(':').map(s => s.trim());
                if (map[key] && val) document.getElementById(map[key]).value = val;
            });
        }

        async function fetchPosts() {
            const tbody = document.getElementById('postsTableBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem;"><i class="fas fa-spinner fa-spin me-2"></i> Loading posts...</td></tr>';
            
            const search = document.getElementById('searchInput').value;
            const category = document.getElementById('categoryFilter').value;
            const res = await api.getPosts(1, search, category);
            if (res && res.success) {
                currentPosts = res.data;
                renderPosts();
            } else {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 2rem; color: var(--danger);">Failed to load posts.</td></tr>';
            }
        }

        function renderPosts() {
            const tbody = document.getElementById('postsTableBody');
            tbody.innerHTML = currentPosts.map(post => `
                <tr>
                    <td>${post.title}</td>
                    <td><span style="background: rgba(99,102,241,0.1); padding: 2px 8px; border-radius: 4px; font-size: 0.8rem;">${post.category}</span></td>
                    <td style="font-size: 0.85rem;">${new Date(post.postDate).toLocaleDateString()}</td>
                    <td><span style="color: ${post.isEnabled ? 'var(--success)' : 'var(--danger)'};">${post.isEnabled ? 'Active' : 'Disabled'}</span></td>
                    <td>
                        <div class="flex gap-2">
                            <button onclick="editPost('${post._id}')" class="btn" style="padding: 4px 8px; background: rgba(255,255,255,0.05);"><i class="fas fa-edit text-primary"></i></button>
                            <button onclick="deletePost('${post._id}')" class="btn" style="padding: 4px 8px; background: rgba(255,255,255,0.05);"><i class="fas fa-trash text-danger"></i></button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function openModal() {
            document.getElementById('postForm').reset();
            document.getElementById('linksContainer').innerHTML = '';
            document.getElementById('vacancyContainer').innerHTML = '';
            addLinkRow('Apply Online', ''); 
            addVacancyRow('General', ''); // Default row
            document.getElementById('postId').value = '';
            document.getElementById('modalTitle').innerText = 'Add New Post';
            document.getElementById('postModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('postModal').style.display = 'none';
        }

        function editPost(id) {
            const post = currentPosts.find(p => p._id === id);
            if (!post) return;
            
            document.getElementById('postId').value = post._id;
            document.getElementById('title').value = post.title;
            document.getElementById('category').value = post.category;
            document.getElementById('department').value = post.department || '';
            document.getElementById('description').value = post.description;
            if (post.applyStartDate) document.getElementById('applyStartDate').value = post.applyStartDate.split('T')[0];
            if (post.lastDate) document.getElementById('lastDate').value = post.lastDate.split('T')[0];
            if (post.scheduledAt) document.getElementById('scheduledAt').value = post.scheduledAt.substring(0, 16);
            document.getElementById('importantLinks').value = JSON.stringify(post.importantLinks || []);
            setFeesFromString(post.applicationFees || '');
            document.getElementById('paymentMode').value = post.paymentMode || '';
            document.getElementById('ageLimit').value = post.ageLimit || '';
            setEligibility(post.eligibility || '');
            document.getElementById('examMode').value = post.examMode || '';
            document.getElementById('admitCardDate').value = post.admitCardDate || '';
            document.getElementById('examDate').value = post.examDate || '';
            document.getElementById('resultDate').value = post.resultDate || '';
            document.getElementById('answerKeyDate').value = post.answerKeyDate || '';
            document.getElementById('totalVacancies').value = post.totalVacancies || '';
            document.getElementById('maleVacancies').value = post.maleVacancies || '';
            document.getElementById('femaleVacancies').value = post.femaleVacancies || '';
            
            // Populate vacancies
            const vContainer = document.getElementById('vacancyContainer');
            vContainer.innerHTML = '';
            try {
                const vDetails = typeof post.vacancyDetails === 'string' ? JSON.parse(post.vacancyDetails || '[]') : post.vacancyDetails;
                if (Array.isArray(vDetails) && vDetails.length > 0) {
                    vDetails.forEach(v => addVacancyRow(v.post || v.dept, v.total || (parseInt(v.male || 0) + parseInt(v.female || 0))));
                } else {
                    addVacancyRow();
                }
            } catch (e) { addVacancyRow(); }

            // Populate links
            const container = document.getElementById('linksContainer');
            container.innerHTML = '';
            const links = post.importantLinks || [];
            if (links.length > 0) {
                links.forEach(link => addLinkRow(link.label, link.url));
            } else {
                addLinkRow();
            }
            
            document.getElementById('modalTitle').innerText = 'Edit Post';
            document.getElementById('postModal').style.display = 'flex';
        }

        async function deletePost(id) {
            if (confirm('Are you sure you want to delete this post?')) {
                const res = await api.deletePost(id);
                if (res && res.success) fetchPosts();
            }
        }

        document.getElementById('postForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');

            // Set loading state
            submitBtn.disabled = true;
            btnText.innerText = 'Processing...';
            btnSpinner.style.display = 'inline-block';

            try {
                const id = document.getElementById('postId').value;
                const formData = new FormData();
                
                formData.append('title', document.getElementById('title').value);
                formData.append('category', document.getElementById('category').value);
                formData.append('department', document.getElementById('department').value);
                formData.append('description', document.getElementById('description').value);
                formData.append('applyStartDate', document.getElementById('applyStartDate').value);
                formData.append('lastDate', document.getElementById('lastDate').value);
                formData.append('scheduledAt', document.getElementById('scheduledAt').value);
                formData.append('importantLinks', getLinksAsJson());
                formData.append('applicationFees', getFeesAsString());
                formData.append('paymentMode', document.getElementById('paymentMode').value);
                formData.append('ageLimit', document.getElementById('ageLimit').value);
                formData.append('eligibility', getEligibility());
                formData.append('examMode', document.getElementById('examMode').value);
                formData.append('admitCardDate', document.getElementById('admitCardDate').value);
                formData.append('examDate', document.getElementById('examDate').value);
                formData.append('resultDate', document.getElementById('resultDate').value);
                formData.append('answerKeyDate', document.getElementById('answerKeyDate').value);
                formData.append('totalVacancies', document.getElementById('totalVacancies').value);
                formData.append('maleVacancies', document.getElementById('maleVacancies').value);
                formData.append('femaleVacancies', document.getElementById('femaleVacancies').value);
                formData.append('vacancyDetails', getVacancyAsJson());

                let res;
                if (id) {
                    res = await api.updatePost(id, formData);
                } else {
                    res = await api.createPost(formData);
                }

                if (res && res.success) {
                    closeModal();
                    await fetchPosts();
                    // Show small success alert
                    alert(id ? 'Post updated successfully!' : 'Post created successfully!');
                } else {
                    alert(res ? res.message : 'Operation failed');
                }
            } catch (err) {
                console.error('Submit error:', err);
                alert('Something went wrong. Please try again.');
            } finally {
                // Reset loading state
                submitBtn.disabled = false;
                btnText.innerText = 'Save Post';
                btnSpinner.style.display = 'none';
            }
        });

        document.getElementById('searchInput').addEventListener('input', fetchPosts);
        document.getElementById('categoryFilter').addEventListener('change', fetchPosts);

        // Auto-open edit modal if ID is in URL
        async function checkUrlParams() {
            await fetchPosts(); // Ensure posts are loaded first
            const urlParams = new URLSearchParams(window.location.search);
            const editId = urlParams.get('edit');
            if (editId) {
                editPost(editId);
                // Clean up URL without refreshing
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        checkUrlParams();
    </script>
</body>
</html>
