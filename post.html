<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="3YAG3ioJ5q8K8YNSH_LmEUjw-99yBElBY9iNj-VBohU" />
  <meta name="description" id="metaDescription" content="Sarkari Result: Get Latest Govt Jobs, Admit Card, Results and more.">
  <meta name="keywords" content="sarkari result, sarkari naukri, latest jobs, admit card, results">
  <meta name="author" content="SarkariNaukri.in">
  
  <title id="pageTitle">Sarkari Result Junction: Job Details</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w2.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23cc0000' stroke='%23f5a623' stroke-width='3'/><text x='50' y='52' font-family='Arial' font-weight='900' font-size='40' fill='white' text-anchor='middle' dominant-baseline='central'>SR</text></svg>">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --red: #cc0000;
      --red-dark: #990000;
      --blue: #003399;
      --blue-dark: #001f66;
      --gold: #f5a623;
      --border: #dee2e6;
      --bg-light: #f8f9fa;
    }

    body {
      font-family: 'Noto Sans', sans-serif;
      background: #f4f6fa;
      color: #333;
      font-size: 14px;
    }

    /* Redesigned Header */
    .site-header {
      background: linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 100%);
    .header-inner { display: flex; align-items: center; gap: 15px; }
    .logo-emblem { width: 55px; height: 55px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .logo-emblem svg { width: 100%; height: 100%; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    .logo-text-block { line-height: 1.1; }
    .logo-main { font-size: 22px; font-weight: 800; color: #fff; text-decoration: none; }
    .logo-main span { color: var(--gold); }
    .logo-sub { font-size: 10px; color: rgba(255,255,255,0.8); font-weight: 700; letter-spacing: 0.5px; }

    .main-nav { background: var(--red); border-bottom: 3px solid var(--red-dark); }
    .nav-link { color: #fff !important; font-weight: 700; text-transform: uppercase; padding: 10px 15px !important; border-right: 1px solid rgba(255,255,255,0.1); }
    .nav-link:hover { background: var(--red-dark); }

    /* Premium Detail Styling */
    .detail-card {
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .detail-header {
      background: #fff;
      padding: 20px;
      border-bottom: 2px solid var(--red);
      text-align: center;
    }

    .post-title {
      color: var(--red-dark);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 10px;
      line-height: 1.3;
    }

    .post-meta-row {
      display: flex;
      justify-content: center;
      gap: 20px;
      font-weight: 700;
      font-size: 13px;
      color: #666;
    }

    .post-meta-row span b { color: var(--red); }

    .section-title {
      background: var(--blue);
      color: #fff;
      font-weight: 800;
      font-size: 16px;
      padding: 8px 15px;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sub-section-title {
      background: #ffefef;
      color: var(--red);
      font-weight: 800;
      font-size: 15px;
      padding: 6px 15px;
      text-align: center;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
    }

    /* Grid Layout for Fee/Dates */
    .info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      border-bottom: 1px solid var(--border);
    }

    .info-col {
      padding: 0;
      border-right: 1px solid var(--border);
    }

    .info-col:last-child { border-right: none; }

    .info-table { width: 100%; border-collapse: collapse; }
    .info-table td { padding: 8px 12px; border-bottom: 1px solid #eee; font-size: 13px; }
    .info-table td:first-child { font-weight: 700; width: 55%; color: #555; }
    .info-table tr:last-child td { border-bottom: none; }

    .full-width-box {
      padding: 15px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      line-height: 1.6;
    }

    .vacancy-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: -1px;
    }
    .vacancy-table th { background: var(--blue-dark); color: #fff; padding: 10px; text-align: center; font-size: 13px; border: 1px solid #fff; }
    .vacancy-table td { padding: 10px; border: 1px solid var(--border); text-align: center; font-weight: 600; }

    .links-table { width: 100%; border-collapse: collapse; }
    .links-table td { padding: 12px; border: 1px solid var(--border); font-weight: 700; text-align: center; }
    .links-table td:first-child { width: 40%; color: var(--red); text-align: left; padding-left: 20px; }
    .links-table a { color: var(--blue); text-decoration: none; border: 1px solid var(--blue); padding: 4px 15px; border-radius: 4px; transition: all 0.2s; }
    .links-table a:hover { background: var(--blue); color: #fff; }

    .social-join {
      background: #003399;
      color: #fff;
      padding: 10px;
      text-align: center;
      font-weight: 800;
      font-size: 16px;
      margin: 20px 0;
      border-radius: 4px;
    }

    .download-steps {
      padding: 20px;
      background: #fff9e6;
      border: 1px solid #ffe0b3;
      border-radius: 4px;
      margin-bottom: 20px;
    }
    .download-steps ol { padding-left: 20px; margin-bottom: 0; }
    .download-steps li { margin-bottom: 8px; font-weight: 600; }

    @media (max-width: 768px) {
      .info-grid { grid-template-columns: 1fr; }
      .info-col { border-right: none; border-bottom: 1px solid var(--border); }
      .post-title { font-size: 18px; }
      .post-meta-row { flex-direction: column; gap: 5px; align-items: center; }
    }

    .footer { background: #1a1a1a; color: #ccc; padding: 30px 0; text-align: center; font-size: 12px; border-top: 5px solid var(--gold); }
    .footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="logo-emblem">
        <svg viewBox="0 0 100 100" xmlns="http://www.w2.org/2000/svg">
          <circle cx="50" cy="50" r="48" fill="#cc0000" stroke="#f5a623" stroke-width="3"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="white" stroke-width="1" stroke-dasharray="2,2"/>
          <text x="50" y="44" font-family="Arial" font-weight="900" font-size="16" fill="white" text-anchor="middle">SARKARI</text>
          <text x="50" y="62" font-family="Arial" font-weight="900" font-size="16" fill="white" text-anchor="middle">RESULT</text>
          <path d="M35 50 L65 50" stroke="#f5a623" stroke-width="2"/>
          <polygon points="50,46 52,50 56,50 53,53 54,57 50,55 46,57 47,53 44,50 48,50" fill="#f5a623"/>
        </svg>
      </a>
      <a href="index.html" style="text-decoration: none;" class="logo-text-block">
        <div class="logo-main">SARKARI<span>RESULT</span></div>
        <div class="logo-sub">JUNCTION • OFFICIAL WEBSITE 2026</div>
      </a>
    </div>
  </header>

  <nav class="main-nav navbar navbar-expand">
    <div class="container justify-content-center">
      <ul class="navbar-nav">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html?category=Latest Jobs">Latest Jobs</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html?category=Results">Results</a></li>
        <li class="nav-item"><a class="nav-link" href="index.html?category=Admit Cards">Admit Card</a></li>
      </ul>
    </div>
  </nav>

  <div class="container my-4">
    <div class="detail-card" id="mainContent">
      <!-- Content will be injected here -->
      <div class="text-center p-5">
        <div class="spinner-border text-primary" role="status"></div>
        <p class="mt-3 font-weight-bold">Loading Recruitment Details...</p>
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>© 2025 SarkariNaukri.in | All Rights Reserved</p>
      <p>Download App | <a href="#">About Us</a> | <a href="#">Contact</a> | <a href="#">Privacy Policy</a></p>
    </div>
  </footer>

  <script>
    const API = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:5000/api'
      : 'https://sarkari-ilnr.onrender.com/api';

    async function loadPost() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      if (!id) return;

      console.log('Fetching post with ID:', id); // Debug Log

      try {
        // Added extra cache busting to be 100% sure
        const res = await fetch(`${API}/posts/${id}?nocache=${Date.now()}`);
        const result = await res.json();
        
        console.log('Server Data:', result.data); // Debug Log

        if (!result.success) {
          document.getElementById('mainContent').innerHTML = '<div class="p-5 text-center text-danger">Post not found. Please try again later.</div>';
          return;
        }

        const post = result.data;
        document.title = post.title + ' - Sarkari Result';
        
        // --- DATA FORMATTING ---

        // Format Fees
        let feesHtml = '';
        if (post.applicationFees) {
          if (Array.isArray(post.applicationFees)) {
            // New structured format
            post.applicationFees.forEach(f => {
              if (f.categories && f.amount) {
                feesHtml += `<tr><td>${f.categories.join(' / ')}</td><td>: ${f.amount}</td></tr>`;
              }
            });
          } else if (typeof post.applicationFees === 'string') {
            // Fallback for old string format
            post.applicationFees.split('|').forEach(f => {
              const [label, val] = f.split(':').map(s => s.trim());
              if(label && val) feesHtml += `<tr><td>${label}</td><td>: ${val}</td></tr>`;
            });
          }
        }
        if (post.paymentMode) feesHtml += `<tr><td>Payment Mode</td><td>: ${post.paymentMode}</td></tr>`;

        // Format Dates
        const formatDate = (d) => d ? new Date(d).toLocaleDateString('en-GB', {day:'2-digit', month:'long', year:'numeric'}) : 'Coming Soon';
        let datesHtml = '';
        
        // Prefer dynamicDates if available
        if (post.dynamicDates && post.dynamicDates.length > 0) {
          post.dynamicDates.forEach(d => {
            datesHtml += `<tr><td>${d.label}</td><td>: ${d.value}</td></tr>`;
          });
        } else {
          // Fallback to specific date fields
          if (post.applyStartDate) datesHtml += `<tr><td>Application Begin</td><td>: ${formatDate(post.applyStartDate)}</td></tr>`;
          if (post.lastDate)       datesHtml += `<tr><td>Last Date to Apply</td><td>: <b class="text-danger">${formatDate(post.lastDate)}</b></td></tr>`;
          if (post.examDate)       datesHtml += `<tr><td>Exam Date</td><td>: ${post.examDate}</td></tr>`;
          if (post.admitCardDate)  datesHtml += `<tr><td>Admit Card Available</td><td>: ${post.admitCardDate}</td></tr>`;
          if (post.resultDate)     datesHtml += `<tr><td>Result Date</td><td>: ${post.resultDate}</td></tr>`;
        }

        // Vacancy Details Table
        let vacancyTableBody = '';
        const vDetails = typeof post.vacancyDetails === 'string' ? JSON.parse(post.vacancyDetails || '[]') : (post.vacancyDetails || []);
        
        if (Array.isArray(vDetails) && vDetails.length > 0) {
          vDetails.forEach(v => {
            const postName = v.post || v.postName || v.dept || '-';
            const total = v.total || v.totalPost || v.total_posts || '-';
            
            // Format Eligibility with bullets if multi-line
            let elig = v.eligibility || post.eligibility || 'See Below';
            if (elig.includes('\n')) {
              const points = elig.split('\n').map(p => p.trim()).filter(Boolean);
              elig = `<ul style="margin: 0; padding-left: 20px; text-align: left;">${points.map(p => `<li>${p}</li>`).join('')}</ul>`;
            }
            
            vacancyTableBody += `<tr><td>${postName}</td><td>${total}</td><td>${elig}</td></tr>`;
          });
        } else {
           vacancyTableBody += `<tr><td>${post.title}</td><td>${post.totalVacancies || post.totalPosts || '-'}</td><td>${post.eligibility || '-'}</td></tr>`;
        }

        // Eligibility Points
        let eligibilityHtml = '';
        if (post.eligibilityPoints && post.eligibilityPoints.length > 0) {
          eligibilityHtml = `<ul style="margin: 0; padding-left: 20px;">${post.eligibilityPoints.map(p => `<li>${p}</li>`).join('')}</ul>`;
        } else {
          eligibilityHtml = post.eligibility || 'As per Recruitment Rules';
        }

        // Physical Eligibility
        let physicalHtml = '';
        if (post.physicalEligibility) {
          const lines = post.physicalEligibility.split('|').map(l => l.trim()).filter(Boolean);
          const rows = lines.map(l => {
             const [name, val] = l.split(':').map(s => s.trim());
             return `<tr><td>${name || 'Detail'}</td><td>${val || '-'}</td></tr>`;
          }).join('');
          physicalHtml = `
            <div class="section-title">Physical Eligibility Details</div>
            <table class="vacancy-table">
              <thead><tr><th>Requirement</th><th>Measurement</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
          `;
        }

        // How to Apply / Selection Process
        let selectionHtml = '';
        if (post.selectionProcessSteps && post.selectionProcessSteps.length > 0) {
          selectionHtml = `<ul style="margin: 0; padding-left: 20px;">${post.selectionProcessSteps.map(p => `<li>${p}</li>`).join('')}</ul>`;
        } else {
          selectionHtml = post.selectionMode || 'See Official Notification';
        }

        let applyStepsHtml = '';
        if (post.howToApplySteps && post.howToApplySteps.length > 0) {
          applyStepsHtml = `<ol style="margin: 0; padding-left: 20px;">${post.howToApplySteps.map(s => `<li>${s}</li>`).join('')}</ol>`;
        } else if (post.howToApply) {
          applyStepsHtml = post.howToApply.split('\n').map(line => `<p style="margin-bottom:5px;">${line}</p>`).join('');
        }

        // Links
        let linksRows = '';
        if (post.importantLinks && post.importantLinks.length > 0) {
          post.importantLinks.forEach(link => {
            linksRows += `<tr><td>${link.label}</td><td><a href="${link.url}" target="_blank">Click Here</a></td></tr>`;
          });
        }

        // Custom Sections
        let customSectionsHtml = '';
        if (post.customSections && post.customSections.length > 0) {
          post.customSections.forEach(sec => {
            let secContent = '';
            if (sec.contentType === 'Text') {
              secContent = `<div class="full-width-box" style="white-space: pre-wrap;">${sec.content}</div>`;
            } else if (sec.contentType === 'Bullets' && Array.isArray(sec.content)) {
              secContent = `<div class="full-width-box"><ul style="margin:0; padding-left:20px;">${sec.content.map(p => `<li>${p}</li>`).join('')}</ul></div>`;
            } else if (sec.contentType === 'Table' && Array.isArray(sec.content)) {
              const rows = sec.content.map(r => `<tr><td style="width:40%; font-weight:700; color:#555;">${r.key}</td><td>: ${r.value}</td></tr>`).join('');
              secContent = `<div class="full-width-box"><table class="info-table" style="width:100%;">${rows}</table></div>`;
            }
            
            customSectionsHtml += `
              <div class="section-title">${sec.title}</div>
              ${secContent}
            `;
          });
        }

        // --- FINAL UI ASSEMBLY ---

        const content = `
          <div class="detail-header">
            <h1 class="post-title" style="color:var(--red); font-size:24px; margin-bottom:5px;">${post.title}</h1>
            ${post.subTitle ? `<h2 style="color:var(--blue); font-size:20px; font-weight:800; margin-bottom:5px;">${post.subTitle}</h2>` : ''}
            ${post.batchName ? `<h3 style="color:var(--red-dark); font-size:18px; font-weight:700;">${post.batchName}</h3>` : ''}
            <div class="post-meta-row mt-3">
              <span><b>Post Date:</b> ${formatDate(post.createdAt)}</span>
              <span><b>Department:</b> ${post.department || 'N/A'}</span>
            </div>
          </div>

          <div class="section-title">Short Information</div>
          <div class="full-width-box">
            ${post.shortInfo || post.description}
          </div>

          <div class="section-title">Recruitment Details</div>
          <div class="info-grid">
            <div class="info-col">
              <div class="sub-section-title">Application Fee</div>
              <table class="info-table">${feesHtml || '<tr><td>Details N/A</td></tr>'}</table>
            </div>
            <div class="info-col">
              <div class="sub-section-title">Important Dates</div>
              <table class="info-table">${datesHtml || '<tr><td>Details N/A</td></tr>'}</table>
            </div>
          </div>

          <div class="section-title">Age Limit Details</div>
          <div class="full-width-box">
            <table class="info-table" style="width: 100%; text-align: left; margin-left: 0;">
              <tbody>
                ${post.minAge ? `<tr><td style="width: 40%;"><b>Minimum Age</b></td><td>: ${post.minAge}</td></tr>` : ''}
                ${post.maxAge ? `<tr><td style="width: 40%;"><b>Maximum Age</b></td><td>: ${post.maxAge}</td></tr>` : ''}
                ${post.ageRelaxation ? `<tr><td style="width: 40%;"><b>Age Relaxation</b></td><td>: ${post.ageRelaxation}</td></tr>` : ''}
                ${(!post.minAge && !post.maxAge && post.ageLimit) ? post.ageLimit.split(/[|\n]/).map(line => {
                  const [label, val] = line.split(':').map(s => s.trim());
                  return label && val ? `<tr><td style="width: 40%;"><b>${label}</b></td><td>: ${val}</td></tr>` : line.trim() ? `<tr><td colspan="2">• ${line}</td></tr>` : '';
                }).join('') : (!post.minAge && !post.maxAge) ? '<tr><td colspan="2">As per Recruitment Rules</td></tr>' : ''}
              </tbody>
            </table>
          </div>

          <div class="section-title">${post.vacancyTableTitle || `Vacancy Details (Total: ${post.totalVacancies || 'N/A'})`}</div>
          <table class="vacancy-table">
            <thead>
              <tr>
                <th style="width: 30%;">Post Name</th>
                <th style="width: 15%;">Total Post</th>
                <th>Eligibility</th>
              </tr>
            </thead>
            <tbody>
              ${vacancyTableBody}
            </tbody>
          </table>

          <div class="section-title">Detailed Eligibility</div>
          <div class="full-width-box">${eligibilityHtml}</div>

          ${physicalHtml}

          <div class="section-title">Selection Process</div>
          <div class="full-width-box">${selectionHtml}</div>

          ${post.payScale || post.salary ? `
            <div class="section-title">Salary (Pay Scale)</div>
            <div class="full-width-box" style="text-align: center; font-weight: 800; color: var(--blue);">
              ${post.payScale || post.salary}
            </div>
          ` : ''}

          <div class="section-title">How to Download / Apply</div>
          <div class="download-steps">${applyStepsHtml || 'See Official Notification'}</div>

          ${customSectionsHtml}

          <div class="social-join">Join Our Telegram / WhatsApp Group for Latest Updates</div>

          <div class="section-title">Important Links</div>
          <table class="links-table">
            <tbody>
              ${linksRows}
              <tr><td>Official Website</td><td><a href="${post.officialWebsite || '#'}" target="_blank">Click Here</a></td></tr>
            </tbody>
          </table>
        `;

        document.getElementById('mainContent').innerHTML = content;

      } catch (err) {
        console.error(err);
        document.getElementById('mainContent').innerHTML = '<div class="p-5 text-center text-danger">Error fetching details.</div>';
      }
    }

    loadPost();
  </script>
</body>
</html>
